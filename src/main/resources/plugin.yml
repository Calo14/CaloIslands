name: CaloIslands
version: 2.0.0-SNAPSHOT
main: me.calo.islands.CaloIslandsPlugin
api-version: '1.21'
description: Local Vaelkor region and city registry
softdepend: [WorldEdit, WorldGuard, Lands]
commands:
  caloislands:
    aliases: [calo]
    usage: /calo help
    permission: caloislands.admin
permissions:
  caloislands.admin:
    default: op
  caloislands.protection.bypass:
    description: Bypass CaloIslands player action protection; does not bypass Lands or WorldGuard.
    default: op
